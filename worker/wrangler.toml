name = "neuro-telerehab-api"
main = "src/index.ts"
compatibility_date = "2024-09-01"
workers_dev = true

[observability]
enabled = true

# Cloudflare Workers AI Binding (uses 10,000 neurons/day free tier)
[ai]
binding = "AI"

# Secrets Store Bindings
# Secrets are accessed asynchronously at runtime via `await env.<BINDING>.get()`
[[secrets_store_secrets]]
binding = "SUPABASE_URL"
store_id = "e0a7dcad230f4191b02e000833b9edc4"
secret_name = "SUPABASE_URL"

[[secrets_store_secrets]]
binding = "SUPABASE_SERVICE_ROLE_KEY"
store_id = "e0a7dcad230f4191b02e000833b9edc4"
secret_name = "SUPABASE_SERVICE_ROLE_KEY"

# JWT signing: private key JWK (JSON string) of the Supabase asymmetric signing
# key (ECC P-256 → ES256). PostgREST verifies with the matching PUBLIC key, so
# RLS `auth.uid()` resolves to the token `sub` claim.
[[secrets_store_secrets]]
binding = "JWT_PRIVATE_JWK"
store_id = "e0a7dcad230f4191b02e000833b9edc4"
secret_name = "JWT_PRIVATE_JWK"

[[secrets_store_secrets]]
binding = "GOOGLE_CLIENT_ID"
store_id = "e0a7dcad230f4191b02e000833b9edc4"
secret_name = "GOOGLE_CLIENT_ID"

[[secrets_store_secrets]]
binding = "GOOGLE_CLIENT_SECRET"
store_id = "e0a7dcad230f4191b02e000833b9edc4"
secret_name = "GOOGLE_CLIENT_SECRET"

[[secrets_store_secrets]]
binding = "GOOGLE_REFRESH_TOKEN"
store_id = "e0a7dcad230f4191b02e000833b9edc4"
secret_name = "GOOGLE_REFRESH_TOKEN"

# vars can hold non-secret config:
[vars]
GOOGLE_CALENDAR_ID = "primary"
ALLOWED_ORIGIN = "https://neuro-telerehab-demo.pages.dev"
# The `kid` shown for your current signing key in Supabase
# (Project Settings → API → JWT Signing Keys). Required when using signing keys
# (e.g. 92dfb5f8-f555-4a58-ba61-e0fac52af7d3) so PostgREST picks the right key.
JWT_KEY_ID = "92dfb5f8-f555-4a58-ba61-e0fac52af7d3"
