name = "neuro-telerehab-api"
main = "src/index.ts"
compatibility_date = "2025-08-01"
workers_dev = true

[observability]
enabled = true

# Cloudflare Workers AI Binding (uses 10,000 neurons/day free tier)
[ai]
binding = "AI"

# Secrets Store Bindings
# Secrets are accessed asynchronously at runtime via `await env.<BINDING>.get()`
[[secrets_store_secrets]]
binding = "SUPABASE_URL"
store_id = "e0a7dcad230f4191b02e000833b9edc4"
secret_name = "SUPABASE_URL"

[[secrets_store_secrets]]
binding = "SUPABASE_SERVICE_ROLE_KEY"
store_id = "e0a7dcad230f4191b02e000833b9edc4"
secret_name = "SUPABASE_SERVICE_ROLE_KEY"

# JWT signing: the Supabase project's Legacy JWT Secret (Project Settings →
# API → JWT Settings → "JWT Secret"). Shared HS256 secret used both to sign
# tokens here and to verify them on Supabase's side (PostgREST/RLS).
[[secrets_store_secrets]]
binding = "SUPABASE_JWT_SECRET"
store_id = "e0a7dcad230f4191b02e000833b9edc4"
secret_name = "SUPABASE_JWT_SECRET"

[[secrets_store_secrets]]
binding = "GOOGLE_CLIENT_ID"
store_id = "e0a7dcad230f4191b02e000833b9edc4"
secret_name = "GOOGLE_CLIENT_ID"

[[secrets_store_secrets]]
binding = "GOOGLE_CLIENT_SECRET"
store_id = "e0a7dcad230f4191b02e000833b9edc4"
secret_name = "GOOGLE_CLIENT_SECRET"

[[secrets_store_secrets]]
binding = "GOOGLE_REFRESH_TOKEN"
store_id = "e0a7dcad230f4191b02e000833b9edc4"
secret_name = "GOOGLE_REFRESH_TOKEN"

# vars can hold non-secret config:
[vars]
GOOGLE_CALENDAR_ID = "primary"
ALLOWED_ORIGIN = "https://telerehab-app.pages.dev"
